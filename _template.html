<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — Anyways Modernize</title>
  <meta name="description" content="{{DESCRIPTION}}"/>
  <link rel="canonical" href="{{URL}}"/>

  <!-- Open Graph (Discord, Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="article"/>
  <meta property="og:site_name" content="Anyways Modernize"/>
  <meta property="og:title" content="{{TITLE}}"/>
  <meta property="og:description" content="{{DESCRIPTION}}"/>
  <meta property="og:url" content="{{URL}}"/>
  <meta property="og:image" content="{{OGIMAGE}}"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="{{TITLE}}"/>
  <meta name="twitter:description" content="{{DESCRIPTION}}"/>
  <meta name="twitter:image" content="{{OGIMAGE}}"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

  <nav>
    <div class="nav-inner" id="nav-inner"></div>
  </nav>

  <div class="container">
    <div class="tag" data-tag="{{TAG}}">{{TAG}}</div>
    <h1>{{TITLE}}</h1>
    <p class="subtitle">{{DESCRIPTION}}</p>
    {{DATES}}

    {{CONTENT}}
  </div>

  <footer></footer>

  <script src="/village.js"></script>
  <script>
function amCopy(btn){
  const code = btn.closest('.am-code').querySelector('pre').innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.classList.add('is-done');
    btn.querySelector('.am-lbl').textContent = 'Copied';
    btn.querySelector('.am-ic').textContent = '✓';
    setTimeout(() => {
      btn.classList.remove('is-done');
      btn.querySelector('.am-lbl').textContent = 'Copy';
      btn.querySelector('.am-ic').textContent = '⧉';
    }, 1600);
  });
}
</script>
</body>
</html>
