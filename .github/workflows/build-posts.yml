name: Build Blog Posts

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore generated post artifacts cache
        id: restore-generated-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            posts/*.html
            og/*.png
          key: generated-site-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            generated-site-${{ github.ref_name }}-

      - name: Determine post build scope
        run: |
          set -euo pipefail

          full_rebuild=false
          changed_posts_file=/tmp/changed_posts.txt
          changed_files_file=/tmp/changed_files.txt
          : > "$changed_posts_file"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            full_rebuild=true
            echo "Workflow dispatch requested: full rebuild"
          elif [ -z "${{ steps.restore-generated-cache.outputs.cache-matched-key }}" ]; then
            full_rebuild=true
            echo "No generated artifacts cache found: full rebuild"
          else
            before_sha="${{ github.event.before }}"
            current_sha="${{ github.sha }}"

            if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              full_rebuild=true
              echo "No comparable previous commit: full rebuild"
            else
              git diff --name-only "$before_sha" "$current_sha" > "$changed_files_file"
              echo "Changed files:"
              cat "$changed_files_file" || true

              if grep -Eq '^(_template.html|og-post-template.svg|.github/workflows/build-posts.yml)$' "$changed_files_file"; then
                full_rebuild=true
                echo "Template asset changed: full rebuild"
              else
                grep -E '^posts/.*\.md$' "$changed_files_file" > "$changed_posts_file" || true
              fi
            fi
          fi

          echo "FULL_REBUILD=${full_rebuild}" >> "$GITHUB_ENV"

          if [ "$full_rebuild" = "true" ]; then
            echo "Post build scope: full"
          else
            count=$(wc -l < "$changed_posts_file" | tr -d ' ')
            echo "Post build scope: incremental (${count} changed markdown file(s))"
            sed -n '1,200p' "$changed_posts_file" || true
          fi

      - name: Remove stale generated post files
        run: |
          set -euo pipefail
          mkdir -p posts og
          for html in posts/*.html; do
            [ -e "$html" ] || continue
            base=$(basename "$html" .html)
            if [ ! -f "posts/${base}.md" ]; then
              rm -f "$html" "og/${base}.png"
              echo "Removed stale generated files for ${base}"
            fi
          done

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Build og-image.png from SVG
        run: |
          sudo apt-get install -y librsvg2-bin fontconfig
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/PixelifySans.ttf \
            "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          curl -sL -o ~/.fonts/Inter.ttf \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
          fc-cache -f ~/.fonts
          rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
          echo "Built og-image.png"
      - name: Convert MD posts to HTML
        run: |
          set -euo pipefail
          mkdir -p og posts

          files_to_build=()
          if [ "${FULL_REBUILD}" = "true" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              files_to_build+=("$f")
            done < <(find posts -maxdepth 1 -type f -name '*.md' | sort)
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              files_to_build+=("$f")
            done < /tmp/changed_posts.txt
          fi

          if [ "${#files_to_build[@]}" -eq 0 ]; then
            echo "No post HTML/OG regeneration required"
            exit 0
          fi

          for f in "${files_to_build[@]}"; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .md)
            title=$(grep '^title:' "$f" | head -1 | sed 's/^title:[[:space:]]*//')
            tag=$(grep '^tag:' "$f" | head -1 | sed 's/^tag:[[:space:]]*//')
            desc=$(grep '^description:' "$f" | head -1 | sed 's/^description:[[:space:]]*//')
            publish_date=$(grep '^publishDate:' "$f" | head -1 | sed 's/^publishDate:[[:space:]]*//' || true)
            updated_date=$(grep '^updatedDate:' "$f" | head -1 | sed 's/^updatedDate:[[:space:]]*//' || true)
            body=$(awk '/^---/{n++; if(n==2){found=1; next}} found' "$f" | pandoc --from markdown+fenced_divs --to html)
            body=$(echo "$body" | python3 -c "
          import sys, re
          html = sys.stdin.read()
          html = re.sub(r'(<div class=\"note\">)\s*<p>(.*?)</p>\s*(</div>)', r'\1\2\3', html, flags=re.DOTALL)
          print(html, end='')
          ")
            echo "$body" > /tmp/post_body.html
            python3 - "$title" "$tag" "$desc" "posts/${name}.html" "$name" "$publish_date" "$updated_date" << 'PYEOF'
          import sys, pathlib
          from xml.sax.saxutils import escape
          from datetime import datetime, timezone
          title, tag, desc, outpath, name = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          publish_date_raw = sys.argv[6] if len(sys.argv) > 6 else ''
          updated_date_raw = sys.argv[7] if len(sys.argv) > 7 else ''
          def parse_date(s):
            if not s:
              return None
            try:
              if 'T' in s:
                return datetime.fromisoformat(s.replace('Z', '+00:00'))
              return datetime.fromisoformat(s).replace(tzinfo=timezone.utc)
            except ValueError:
              return None
          pub_dt  = parse_date(publish_date_raw)
          upd_dt  = parse_date(updated_date_raw)
          if pub_dt:
            pub_str = pub_dt.strftime('%B %d, %Y')
            if upd_dt and upd_dt.date() != pub_dt.date():
              dates_html = f'<p class="post-dates">{pub_str} (updated {upd_dt.strftime("%B %d, %Y")})</p>'
            else:
              dates_html = f'<p class="post-dates">{pub_str}</p>'
          else:
            dates_html = ''
          body = pathlib.Path('/tmp/post_body.html').read_text()
          tmpl = pathlib.Path('_template.html').read_text()
          url     = f'https://anyways-modernize.github.io/{outpath}'
          ogimage = f'https://anyways-modernize.github.io/og/{name}.png'
          html = (tmpl
            .replace('{{TITLE}}',       title)
            .replace('{{TAG}}',         tag)
            .replace('{{DESCRIPTION}}', desc)
            .replace('{{DATES}}',       dates_html)
            .replace('{{URL}}',         url)
            .replace('{{OGIMAGE}}',     ogimage)
            .replace('{{CONTENT}}',     body))
          pathlib.Path(outpath).write_text(html)
          print(f'Built: {outpath}')
          # ── Build per-post Open Graph image ──
          og_tmpl = pathlib.Path('og-post-template.svg').read_text()
          # word-wrap the title (max ~20 chars/line, up to 3 lines)
          words, lines, cur = title.split(), [], ''
          for w in words:
            if len(cur) + len(w) + 1 <= 20 or not cur:
              cur = f'{cur} {w}'.strip()
            else:
              lines.append(cur); cur = w
          if cur:
            lines.append(cur)
          if len(lines) > 3:
            lines = lines[:3]
            lines[2] = lines[2].rstrip('.') + '...'
          start_y = 330 - (len(lines) - 1) * 38
          tspans = ''
          for i, ln in enumerate(lines):
            dy = '' if i == 0 else ' dy="76"'
            y  = f' y="{start_y}"' if i == 0 else ''
            tspans += f'<tspan x="600"{y}{dy}>{escape(ln)}</tspan>'
          tag_up = tag.upper()
          tag_w  = max(90, len(tag_up) * 17 + 40)
          tag_x  = 600 - tag_w / 2
          svg = (og_tmpl
            .replace('__TAG_X__',        f'{tag_x:.0f}')
            .replace('__TAG_W__',        f'{tag_w:.0f}')
            .replace('__TAG__',          escape(tag_up))
            .replace('__TITLE_TSPANS__', tspans))
          pathlib.Path('/tmp/og_post.svg').write_text(svg)
          PYEOF
            rsvg-convert -w 1200 -h 630 /tmp/og_post.svg -o "og/${name}.png"
            echo "Built og/${name}.png"
          done
      - name: Generate scrolls.html, search.json and update index.html
        run: |
          python3 << 'PYEOF'
          import pathlib, re, subprocess, json
          from datetime import datetime, timezone
          posts = []
          for f in sorted(pathlib.Path('posts').glob('*.md')):
            txt = f.read_text()
            def meta(key):
              m = re.search(rf'^{key}:[^\S\r\n]*(.*)', txt, re.MULTILINE)
              return m.group(1).strip() if m else ''
            # Check for explicit publishDate in frontmatter
            publish_date_str = meta('publishDate')
            if publish_date_str:
              try:
                # Try parsing ISO format first (e.g., "2026-05-28" or "2026-05-28T10:30:00Z")
                if 'T' in publish_date_str:
                  parsed_dt = datetime.fromisoformat(publish_date_str.replace('Z', '+00:00'))
                else:
                  # Parse date-only format (e.g., "2026-05-28")
                  parsed_dt = datetime.fromisoformat(publish_date_str).replace(tzinfo=timezone.utc)
                display_date = parsed_dt.strftime('%B %d, %Y')
              except ValueError:
                # Fall back to git log if publishDate is invalid
                result = subprocess.run(
                  ['git', 'log', '-1', '--format=%aI', '--', str(f)],
                  capture_output=True, text=True
                )
                timestamp_str = result.stdout.strip()
                try:
                  parsed_dt = datetime.fromisoformat(timestamp_str)
                  display_date = parsed_dt.strftime('%B %d, %Y')
                except ValueError:
                  parsed_dt = datetime.min.replace(tzinfo=timezone.utc)
                  display_date = ''
            else:
              # If no publishDate, use git log (file creation/first commit time)
              result = subprocess.run(
                ['git', 'log', '--format=%aI', '--', str(f)],
                capture_output=True, text=True
              )
              lines = result.stdout.strip().split('\n')
              # Get the last (oldest) commit for this file
              timestamp_str = lines[-1] if lines and lines[-1] else ''
              try:
                parsed_dt = datetime.fromisoformat(timestamp_str)
                display_date = parsed_dt.strftime('%B %d, %Y')
              except ValueError:
                parsed_dt = datetime.min.replace(tzinfo=timezone.utc)
                display_date = ''
            # Check for explicit updatedDate in frontmatter
            updated_date_str = meta('updatedDate')
            updated_dt = None
            updated_display_date = ''
            if updated_date_str:
              try:
                if 'T' in updated_date_str:
                  updated_dt = datetime.fromisoformat(updated_date_str.replace('Z', '+00:00'))
                else:
                  updated_dt = datetime.fromisoformat(updated_date_str).replace(tzinfo=timezone.utc)
                updated_display_date = updated_dt.strftime('%B %d, %Y')
              except ValueError:
                updated_dt = None
                updated_display_date = ''
            else:
              # If no updatedDate, use last git commit (most recent change)
              result = subprocess.run(
                ['git', 'log', '-1', '--format=%aI', '--', str(f)],
                capture_output=True, text=True
              )
              timestamp_str = result.stdout.strip()
              try:
                updated_dt = datetime.fromisoformat(timestamp_str)
                updated_display_date = updated_dt.strftime('%B %d, %Y')
              except ValueError:
                updated_dt = None
                updated_display_date = ''
            # Only show updated date if it differs from publish date
            display_updated_date = ''
            if updated_dt and updated_dt.date() != parsed_dt.date():
              display_updated_date = updated_display_date
            # strip frontmatter and get plain text body for search
            body_md = re.sub(r'^---.*?---\s*', '', txt, flags=re.DOTALL)
            # strip markdown syntax to plain text
            body_plain = re.sub(r'[#*`_~\[\]()>:|]+', ' ', body_md)
            body_plain = re.sub(r'\s+', ' ', body_plain).strip()
            body_plain = body_plain[:500]  # add this line
            posts.append({
              'title':        meta('title'),
              'tag':          meta('tag'),
              'desc':         meta('description'),
              'parsed_dt':    parsed_dt,
              'display_date': display_date,
              'display_updated_date': display_updated_date,
              'href':         f'/posts/{f.stem}.html',
              'body':         body_plain,
            })
          posts.sort(key=lambda p: p['parsed_dt'], reverse=True)
          # ── Generate search.json ──
          search_data = [{
            'title': p['title'],
            'tag':   p['tag'],
            'desc':  p['desc'],
            'date':  p['display_date'],
            'href':  p['href'],
            'body':  p['body'],
          } for p in posts]
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/search.json').write_text(json.dumps(search_data, ensure_ascii=False, indent=2))
          print(f'Built search.json with {len(search_data)} posts')
          # ── Generate sitemap.xml ──
          BASE_URL = 'https://anyways-modernize.github.io'
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          def url_entry(loc, lastmod, changefreq, priority):
            return (
              '  <url>\n'
              f'    <loc>{loc}</loc>\n'
              f'    <lastmod>{lastmod}</lastmod>\n'
              f'    <changefreq>{changefreq}</changefreq>\n'
              f'    <priority>{priority}</priority>\n'
              '  </url>'
            )
          urls = [
            url_entry(f'{BASE_URL}/',              today, 'daily',  '1.0'),
            url_entry(f'{BASE_URL}/scrolls.html',  today, 'daily',  '0.9'),
            url_entry(f'{BASE_URL}/search.html',   today, 'weekly', '0.5'),
            url_entry(f'{BASE_URL}/traveler.html', today, 'monthly','0.5'),
          ]
          for p in posts:
            lastmod = p['parsed_dt'].strftime('%Y-%m-%d') if p['parsed_dt'] != datetime.min.replace(tzinfo=timezone.utc) else today
            urls.append(url_entry(f'{BASE_URL}{p["href"]}', lastmod, 'monthly', '0.8'))
          sitemap = (
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            + '\n'.join(urls)
            + '\n</urlset>\n'
          )
          pathlib.Path('sitemap.xml').write_text(sitemap)
          print(f'Built sitemap.xml with {len(urls)} URLs')
          # ── Generate scrolls.html ──
          all_cards = ''
          for p in posts:
            date_label = f'<span class="post-date">{p["display_date"]}</span>' if p["display_date"] else ''
            all_cards += f'''
            <div class="post-card">
              <div class="tag" data-tag="{p["tag"]}">{p["tag"]}</div>
              {date_label}
              <h3><a class="post-title-link" href="{p["href"]}">{p["title"]}</a></h3>
              <p>{p["desc"]}</p>
              <a class="read-more" href="{p["href"]}">Read the scroll →</a>
            </div>'''
          scrolls_page = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>All Scrolls — Anyways Modernize</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="/css/style.css"/>
          </head>
          <body>
            <div class="stars">
              <div class="star" style="top:10%;left:20%;"></div>
              <div class="star" style="top:30%;left:70%;"></div>
              <div class="star" style="top:55%;left:45%;"></div>
              <div class="star" style="top:75%;left:80%;"></div>
              <div class="star" style="top:20%;left:88%;"></div>
            </div>
            <nav>
              <div class="nav-inner" id="nav-inner"></div>
            </nav>
            <section class="section">
              <h2 class="section-title">📜 All Scrolls</h2>
              <div class="posts">{all_cards}</div>
            </section>
            <footer></footer>
            <script src="/village.js"></script>
          </body>
          </html>'''
          pathlib.Path('scrolls.html').write_text(scrolls_page)
          print(f'Built scrolls.html with {len(posts)} posts')
          # ── Update index.html latest 3 ──
          latest = posts[:3]
          index_cards = ''
          for p in latest:
            date_label = f'<span class="post-date">{p["display_date"]}</span>' if p["display_date"] else ''
            index_cards += f'''
              <div class="post-card">
                <div class="tag" data-tag="{p["tag"]}">{p["tag"]}</div>
                {date_label}
                <h3><a class="post-title-link" href="{p["href"]}">{p["title"]}</a></h3>
                <p>{p["desc"]}</p>
                <a class="read-more" href="{p["href"]}">Read the scroll →</a>
              </div>'''
          index_html = pathlib.Path('index.html').read_text()
          new_posts_block = f'<!-- POSTS START -->\n      <div class="posts">{index_cards}\n      </div>\n      <!-- POSTS END -->'
          index_html = re.sub(
            r'<!-- POSTS START -->.*?<!-- POSTS END -->',
            new_posts_block,
            index_html,
            flags=re.DOTALL
          )
          pathlib.Path('index.html').write_text(index_html)
          print(f'Updated index.html with {len(latest)} latest posts')
          PYEOF

      - name: Prepare IndexNow URL list
        env:
          BASE_URL: https://anyways-modernize.github.io
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          base = os.environ['BASE_URL'].rstrip('/')
          full_rebuild = os.environ.get('FULL_REBUILD', 'false').lower() == 'true'
          out = pathlib.Path('/tmp/indexnow_urls.txt')

          urls = set()
          if full_rebuild:
              sitemap = pathlib.Path('sitemap.xml')
              if sitemap.exists():
                  root = ET.fromstring(sitemap.read_bytes())
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  for node in root.findall('sm:url/sm:loc', ns):
                      value = (node.text or '').strip()
                      if value:
                          urls.add(value)
          else:
              changed = pathlib.Path('/tmp/changed_posts.txt')
              if changed.exists():
                  for line in changed.read_text().splitlines():
                      line = line.strip()
                      if not line:
                          continue
                      stem = pathlib.Path(line).stem
                      urls.add(f'{base}/posts/{stem}.html')

              if urls:
                  urls.add(f'{base}/')
                  urls.add(f'{base}/scrolls.html')
                  urls.add(f'{base}/search.html')
                  urls.add(f'{base}/sitemap.xml')

          if urls:
              out.write_text('\n'.join(sorted(urls)) + '\n')
              print(f'Prepared {len(urls)} IndexNow URL(s)')
          else:
              out.write_text('')
              print('Prepared 0 IndexNow URL(s)')
          PYEOF

      - name: Publish IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "INDEXNOW_KEY is not configured; skipping key file publish"
            exit 0
          fi
          printf '%s' "$INDEXNOW_KEY" > "${INDEXNOW_KEY}.txt"
          echo "Published IndexNow key file"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Save generated post artifacts cache
        uses: actions/cache/save@v5
        with:
          path: |
            posts/*.html
            og/*.png
          key: generated-site-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Submit IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_ENDPOINT: https://api.indexnow.org/indexnow
          SITE_HOST: anyways-modernize.github.io
        run: |
          set -euo pipefail

          if [ -z "${INDEXNOW_KEY:-}" ]; then
            echo "INDEXNOW_KEY is not configured; skipping IndexNow submission"
            exit 0
          fi

          if [ ! -s /tmp/indexnow_urls.txt ]; then
            echo "No changed URLs to submit to IndexNow"
            exit 0
          fi

          python3 << 'PYEOF'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          endpoint = os.environ['INDEXNOW_ENDPOINT']
          key = os.environ['INDEXNOW_KEY']
          host = os.environ['SITE_HOST']
          key_location = f'https://{host}/{key}.txt'

          urls = [
              line.strip()
              for line in pathlib.Path('/tmp/indexnow_urls.txt').read_text().splitlines()
              if line.strip()
          ]

          payload = {
              'host': host,
              'key': key,
              'keyLocation': key_location,
              'urlList': urls,
          }

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode('utf-8', errors='replace')
                  print(f'IndexNow HTTP {resp.status}')
                  if body:
                      print(body[:2000])
          except Exception as ex:
              print(f'IndexNow submission failed: {ex}')
              sys.exit(1)
          PYEOF
