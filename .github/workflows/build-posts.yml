name: Build Blog Posts

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Build og-image.png from SVG
        run: |
          sudo apt-get install -y librsvg2-bin fontconfig
          mkdir -p ~/.fonts
          curl -sL -o ~/.fonts/PixelifySans.ttf \
            "https://github.com/google/fonts/raw/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf"
          curl -sL -o ~/.fonts/Inter.ttf \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
          fc-cache -f ~/.fonts
          rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png
          echo "Built og-image.png"
      - name: Convert MD posts to HTML
        run: |
          mkdir -p og
          for f in posts/*.md; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .md)
            title=$(grep '^title:' "$f" | head -1 | sed 's/^title:[[:space:]]*//')
            tag=$(grep '^tag:' "$f" | head -1 | sed 's/^tag:[[:space:]]*//')
            desc=$(grep '^description:' "$f" | head -1 | sed 's/^description:[[:space:]]*//')
            body=$(awk '/^---/{n++; if(n==2){found=1; next}} found' "$f" | pandoc --from markdown+fenced_divs --to html)
            body=$(echo "$body" | python3 -c "
          import sys, re
          html = sys.stdin.read()
          html = re.sub(r'(<div class=\"note\">)\s*<p>(.*?)</p>\s*(</div>)', r'\1\2\3', html, flags=re.DOTALL)
          print(html, end='')
          ")
            echo "$body" > /tmp/post_body.html
            python3 - "$title" "$tag" "$desc" "posts/${name}.html" "$name" << 'PYEOF'
          import sys, pathlib
          from xml.sax.saxutils import escape
          title, tag, desc, outpath, name = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          body = pathlib.Path('/tmp/post_body.html').read_text()
          tmpl = pathlib.Path('_template.html').read_text()
          url     = f'https://anyways-modernize.github.io/{outpath}'
          ogimage = f'https://anyways-modernize.github.io/og/{name}.png'
          html = (tmpl
            .replace('{{TITLE}}',       title)
            .replace('{{TAG}}',         tag)
            .replace('{{DESCRIPTION}}', desc)
            .replace('{{URL}}',         url)
            .replace('{{OGIMAGE}}',     ogimage)
            .replace('{{CONTENT}}',     body))
          pathlib.Path(outpath).write_text(html)
          print(f'Built: {outpath}')
          # ── Build per-post Open Graph image ──
          og_tmpl = pathlib.Path('og-post-template.svg').read_text()
          # word-wrap the title (max ~20 chars/line, up to 3 lines)
          words, lines, cur = title.split(), [], ''
          for w in words:
            if len(cur) + len(w) + 1 <= 20 or not cur:
              cur = f'{cur} {w}'.strip()
            else:
              lines.append(cur); cur = w
          if cur:
            lines.append(cur)
          if len(lines) > 3:
            lines = lines[:3]
            lines[2] = lines[2].rstrip('.') + '...'
          start_y = 330 - (len(lines) - 1) * 38
          tspans = ''
          for i, ln in enumerate(lines):
            dy = '' if i == 0 else ' dy="76"'
            y  = f' y="{start_y}"' if i == 0 else ''
            tspans += f'<tspan x="600"{y}{dy}>{escape(ln)}</tspan>'
          tag_up = tag.upper()
          tag_w  = max(90, len(tag_up) * 17 + 40)
          tag_x  = 600 - tag_w / 2
          svg = (og_tmpl
            .replace('__TAG_X__',        f'{tag_x:.0f}')
            .replace('__TAG_W__',        f'{tag_w:.0f}')
            .replace('__TAG__',          escape(tag_up))
            .replace('__TITLE_TSPANS__', tspans))
          pathlib.Path('/tmp/og_post.svg').write_text(svg)
          PYEOF
            rsvg-convert -w 1200 -h 630 /tmp/og_post.svg -o "og/${name}.png"
            echo "Built og/${name}.png"
          done
      - name: Generate scrolls.html, search.json and update index.html
        run: |
          python3 << 'PYEOF'
          import pathlib, re, subprocess, json
          from datetime import datetime, timezone
          posts = []
          for f in sorted(pathlib.Path('posts').glob('*.md')):
            txt = f.read_text()
            def meta(key):
              m = re.search(rf'^{key}:[^\S\r\n]*(.*)', txt, re.MULTILINE)
              return m.group(1).strip() if m else ''
            result = subprocess.run(
              ['git', 'log', '-1', '--format=%aI', '--', str(f)],
              capture_output=True, text=True
            )
            timestamp_str = result.stdout.strip()
            try:
              parsed_dt = datetime.fromisoformat(timestamp_str)
              display_date = parsed_dt.strftime('%B %d, %Y')
            except ValueError:
              parsed_dt = datetime.min.replace(tzinfo=timezone.utc)
              display_date = ''
            # strip frontmatter and get plain text body for search
            body_md = re.sub(r'^---.*?---\s*', '', txt, flags=re.DOTALL)
            # strip markdown syntax to plain text
            body_plain = re.sub(r'[#*`_~\[\]()>:|]+', ' ', body_md)
            body_plain = re.sub(r'\s+', ' ', body_plain).strip()
            body_plain = body_plain[:500]  # add this line
            posts.append({
              'title':        meta('title'),
              'tag':          meta('tag'),
              'desc':         meta('description'),
              'parsed_dt':    parsed_dt,
              'display_date': display_date,
              'href':         f'/posts/{f.stem}.html',
              'body':         body_plain,
            })
          posts.sort(key=lambda p: p['parsed_dt'], reverse=True)
          # ── Generate search.json ──
          search_data = [{
            'title': p['title'],
            'tag':   p['tag'],
            'desc':  p['desc'],
            'date':  p['display_date'],
            'href':  p['href'],
            'body':  p['body'],
          } for p in posts]
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/search.json').write_text(json.dumps(search_data, ensure_ascii=False, indent=2))
          print(f'Built search.json with {len(search_data)} posts')
          # ── Generate sitemap.xml ──
          BASE_URL = 'https://anyways-modernize.github.io'
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          def url_entry(loc, lastmod, changefreq, priority):
            return (
              '  <url>\n'
              f'    <loc>{loc}</loc>\n'
              f'    <lastmod>{lastmod}</lastmod>\n'
              f'    <changefreq>{changefreq}</changefreq>\n'
              f'    <priority>{priority}</priority>\n'
              '  </url>'
            )
          urls = [
            url_entry(f'{BASE_URL}/',              today, 'daily',  '1.0'),
            url_entry(f'{BASE_URL}/scrolls.html',  today, 'daily',  '0.9'),
            url_entry(f'{BASE_URL}/search.html',   today, 'weekly', '0.5'),
            url_entry(f'{BASE_URL}/traveler.html', today, 'monthly','0.5'),
          ]
          for p in posts:
            lastmod = p['parsed_dt'].strftime('%Y-%m-%d') if p['parsed_dt'] != datetime.min.replace(tzinfo=timezone.utc) else today
            urls.append(url_entry(f'{BASE_URL}{p["href"]}', lastmod, 'monthly', '0.8'))
          sitemap = (
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            + '\n'.join(urls)
            + '\n</urlset>\n'
          )
          pathlib.Path('sitemap.xml').write_text(sitemap)
          print(f'Built sitemap.xml with {len(urls)} URLs')
          # ── Generate scrolls.html ──
          all_cards = ''
          for p in posts:
            date_label = f'<span class="post-date">{p["display_date"]}</span>' if p["display_date"] else ''
            all_cards += f'''
            <div class="post-card">
              <div class="tag" data-tag="{p["tag"]}">{p["tag"]}</div>
              {date_label}
              <h3>{p["title"]}</h3>
              <p>{p["desc"]}</p>
              <a class="read-more" href="{p["href"]}">Read the scroll →</a>
            </div>'''
          scrolls_page = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>All Scrolls — Anyways Modernize</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="/css/style.css"/>
          </head>
          <body>
            <div class="stars">
              <div class="star" style="top:10%;left:20%;"></div>
              <div class="star" style="top:30%;left:70%;"></div>
              <div class="star" style="top:55%;left:45%;"></div>
              <div class="star" style="top:75%;left:80%;"></div>
              <div class="star" style="top:20%;left:88%;"></div>
            </div>
            <nav>
              <div class="nav-inner" id="nav-inner"></div>
            </nav>
            <section class="section">
              <h2 class="section-title">📜 All Scrolls</h2>
              <div class="posts">{all_cards}</div>
            </section>
            <footer></footer>
            <script src="/village.js"></script>
          </body>
          </html>'''
          pathlib.Path('scrolls.html').write_text(scrolls_page)
          print(f'Built scrolls.html with {len(posts)} posts')
          # ── Update index.html latest 3 ──
          latest = posts[:3]
          index_cards = ''
          for p in latest:
            date_label = f'<span class="post-date">{p["display_date"]}</span>' if p["display_date"] else ''
            index_cards += f'''
              <div class="post-card">
                <div class="tag" data-tag="{p["tag"]}">{p["tag"]}</div>
                {date_label}
                <h3>{p["title"]}</h3>
                <p>{p["desc"]}</p>
                <a class="read-more" href="{p["href"]}">Read the scroll →</a>
              </div>'''
          index_html = pathlib.Path('index.html').read_text()
          new_posts_block = f'<!-- POSTS START -->\n      <div class="posts">{index_cards}\n      </div>\n      <!-- POSTS END -->'
          index_html = re.sub(
            r'<!-- POSTS START -->.*?<!-- POSTS END -->',
            new_posts_block,
            index_html,
            flags=re.DOTALL
          )
          pathlib.Path('index.html').write_text(index_html)
          print(f'Updated index.html with {len(latest)} latest posts')
          PYEOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
