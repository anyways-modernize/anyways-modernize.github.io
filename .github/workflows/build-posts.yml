name: Build Blog Posts

on:
  push:
    paths:
      - 'posts/**.md'
      - '_template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert MD posts to HTML
        run: |
          for f in posts/*.md; do
            name=$(basename "$f" .md)
            
            # Extract frontmatter fields
            title=$(grep '^title:' "$f" | sed 's/title: //')
            tag=$(grep '^tag:' "$f" | sed 's/tag: //')
            desc=$(grep '^description:' "$f" | sed 's/description: //')
            
            # Convert MD body to HTML (skip frontmatter lines)
            body=$(pandoc --from markdown --to html "$f")
            
            # Fill template
            sed \
              -e "s|{{TITLE}}|$title|g" \
              -e "s|{{TAG}}|$tag|g" \
              -e "s|{{DESCRIPTION}}|$desc|g" \
              -e "s|{{CONTENT}}|$body|g" \
              _template.html > "posts/${name}.html"
            
            echo "Built: posts/${name}.html"
          done

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.html
          git diff --staged --quiet || git commit -m "Auto-generate HTML from Markdown posts"
          git push
