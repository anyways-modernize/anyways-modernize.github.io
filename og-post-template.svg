<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1d2d40"/>
      <stop offset="55%" stop-color="#0d141c"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffefad" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffefad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d141c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070d14" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120"  cy="70"  r="2"   opacity="0.8"/>
    <circle cx="300"  cy="120" r="1.5" opacity="0.5"/>
    <circle cx="470"  cy="60"  r="2"   opacity="0.7"/>
    <circle cx="640"  cy="100" r="1.5" opacity="0.45"/>
    <circle cx="820"  cy="55"  r="2"   opacity="0.8"/>
    <circle cx="1010" cy="130" r="1.5" opacity="0.5"/>
    <circle cx="1120" cy="80"  r="2"   opacity="0.7"/>
    <circle cx="210"  cy="200" r="1.5" opacity="0.45"/>
    <circle cx="560"  cy="180" r="1.5" opacity="0.5"/>
    <circle cx="900"  cy="210" r="1.5" opacity="0.5"/>
  </g>

  <!-- moon -->
  <circle cx="1010" cy="120" r="100" fill="url(#moonGlow)"/>
  <circle cx="1010" cy="120" r="46" fill="#ffefad"/>
  <circle cx="1034" cy="108" r="46" fill="#0d141c" opacity="0.92"/>

  <!-- far mountain ridge -->
  <polygon points="
    0,470 80,420 170,440 260,400 360,425 460,390 560,415 660,385 760,410
    860,378 960,405 1060,375 1140,400 1200,388 1200,630 0,630"
    fill="#0f1a25" opacity="0.9"/>

  <!-- mid hills -->
  <ellipse cx="180"  cy="600" rx="260" ry="70" fill="#0c1520"/>
  <ellipse cx="640"  cy="610" rx="320" ry="60" fill="#0c1520"/>
  <ellipse cx="1080" cy="600" rx="280" ry="65" fill="#0c1520"/>

  <!-- ground -->
  <rect x="0" y="560" width="1200" height="70" fill="url(#groundFade)"/>
  <rect x="0" y="612" width="1200" height="18" fill="#08111a"/>

  <!-- village cluster (left) -->
  <rect x="120" y="500" width="70" height="92" fill="#0b1520"/>
  <polygon points="112,503 198,503 155,462" fill="#111e2e"/>
  <rect x="136" y="518" width="17" height="22" fill="#ffd84d" opacity="0.35"/>
  <rect x="162" y="518" width="17" height="22" fill="#ffd84d" opacity="0.25"/>
  <rect x="148" y="552" width="18" height="40" fill="#0b1520"/>
  <rect x="180" y="462" width="8" height="24" fill="#090f18"/>

  <rect x="220" y="535" width="54" height="58" fill="#0b1520"/>
  <polygon points="214,537 280,537 247,508" fill="#111e2e"/>
  <rect x="232" y="548" width="13" height="15" fill="#ffd84d" opacity="0.3"/>
  <rect x="252" y="548" width="13" height="15" fill="#ffd84d" opacity="0.22"/>

  <!-- village cluster (right) -->
  <rect x="940" y="525" width="58" height="68" fill="#0b1520"/>
  <polygon points="934,527 1004,527 969,496" fill="#111e2e"/>
  <rect x="954" y="540" width="14" height="16" fill="#ffd84d" opacity="0.3"/>
  <rect x="976" y="540" width="14" height="16" fill="#ffd84d" opacity="0.22"/>

  <rect x="1030" y="545" width="48" height="48" fill="#0b1520"/>
  <polygon points="1024,547 1084,547 1054,522" fill="#111e2e"/>
  <rect x="1042" y="558" width="12" height="14" fill="#ffd84d" opacity="0.28"/>

  <!-- pine trees -->
  <polygon points="320,592 305,592 312,560" fill="#0c1c18"/>
  <polygon points="322,575 304,575 313,548" fill="#0e2420"/>
  <polygon points="900,592 884,592 892,558" fill="#0c1c18"/>
  <polygon points="902,575 882,575 892,547" fill="#0e2420"/>

  <!-- tag pill -->
  <rect x="__TAG_X__" y="120" width="__TAG_W__" height="46" rx="23" fill="#ffd84d"/>
  <text x="600" y="151" text-anchor="middle"
        font-family="'Inter', 'DejaVu Sans', sans-serif"
        font-size="24" font-weight="700" fill="#0d141c" letter-spacing="2">__TAG__</text>

  <!-- post title -->
  <text text-anchor="middle"
        font-family="'Inter', 'DejaVu Sans', sans-serif"
        font-size="60" font-weight="700" fill="#dce7f2">__TITLE_TSPANS__</text>

  <!-- footer -->
  <text x="600" y="560" text-anchor="middle"
        font-family="'Pixelify Sans', 'DejaVu Sans', sans-serif"
        font-size="34" font-weight="700" fill="#ffd84d">Anyways Modernize</text>
</svg>
