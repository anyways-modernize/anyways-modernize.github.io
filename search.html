<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search — Anyways Modernize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="icon" type="image/x-icon" href="/favicon.png">
  <style>
    .search-wrap {
      max-width: 750px;
      margin: 3rem auto 0;
      padding: 0 1.5rem;
      position: relative;
      z-index: 10;
    }
    .search-input {
      width: 100%;
      background: rgba(26,38,51,0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1.4rem;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: rgba(255,216,77,0.5); }
    .search-count {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 1rem 0 1.5rem;
      min-height: 1.2em;
    }
    .highlight {
      background: rgba(255,216,77,0.25);
      color: var(--yellow);
      border-radius: 3px;
      padding: 0 2px;
    }
    .no-results {
      color: var(--muted);
      text-align: center;
      padding: 3rem 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="stars">
    <div class="star" style="top:10%;left:20%;"></div>
    <div class="star" style="top:30%;left:70%;"></div>
    <div class="star" style="top:55%;left:45%;"></div>
    <div class="star" style="top:75%;left:80%;"></div>
    <div class="star" style="top:20%;left:88%;"></div>
  </div>

  <nav>
    <div class="nav-inner" id="nav-inner"></div>
  </nav>

  <div class="search-wrap">
    <h2 class="section-title" style="margin-bottom:1.5rem;">🔍 Search Scrolls</h2>
    <input
      type="text"
      class="search-input"
      id="search-input"
      placeholder="Search by keyword, tag, or title…"
      autofocus
    />
    <p class="search-count" id="search-count"></p>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="posts" id="results"></div>
    <div id="pagination"></div>
  </section>

  <footer></footer>

  <script src="/village.js"></script>
  <script src="/scripts/search.js"></script>
</body>
</html>
